services:
  db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: comics_development
    ports: # This is only for development. DO NOT expose postgresql ports in a real deployment.
      - "5432:5432"

