# Copy to ./config.yaml or ~/.config/comics/config.yaml (first one found wins),
# or pass a path with -config.

# Address to listen on.
listen: ":3000"

# SQLite database file, created if it doesn't exist. Can also be set with
# COMICS_DATABASE_PATH. Relative paths are resolved against this file's directory.
database_path: "comics.db"

# Where page images are stored. Relative paths are resolved against this
# file's directory.
storage_dir: "storage"

# Maximum size of a single uploaded archive, in MB.
max_upload_mb: 2048

# How many uploads/imports are extracted (or downloaded) at the same time in
# the background. Others wait in a queue.
import_workers: 2

# Set to true when serving over HTTPS.
secure_cookies: false
