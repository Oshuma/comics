# nginx site for Comics. Copy to /etc/nginx/sites-available/ (or conf.d/),
# adjust the server name, certificate paths and upstream port, then reload.
#
# The upstream port must match `listen` in config.yaml. Binding the app to
# localhost keeps it reachable only through nginx:
#
#   listen: "127.0.0.1:3000"
#   secure_cookies: true

upstream comics {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name comics.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name comics.example.com;

    ssl_certificate     /etc/letsencrypt/live/comics.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comics.example.com/privkey.pem;

    # Keep in sync with max_upload_mb in config.yaml.
    client_max_body_size 2048m;

    location / {
        proxy_pass http://comics;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stream uploads straight to the app instead of buffering them to disk
    # first, and allow time for large archives to be extracted.
    location = /api/comics {
        proxy_pass http://comics;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }
}
